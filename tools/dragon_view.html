<!doctype html>
<!-- Dragon turntable for working on tools/build_dragon.py and client/js/render/dragon.js:
       node tools/serve.mjs . 8090     then open   http://127.0.0.1:8090/tools/dragon_view.html?breed=storm&cam=14,6,-16,0,0.5,0
     query: breed=ember|frost|storm|venom  cam=x,y,z,tx,ty,tz (three.js axes, the dragon flies toward -Z)  fov  far=1 (LOD1)
            phase (wingbeat) thr (effort) look (head yaw) breath=1 roll yaw  hdrbg=1 (sky backdrop) bg=rrggbb  w h
     it sets window.__done once rendered, so a headless browser can screenshot it. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SKY, tameEnvironment } from '/client/js/render/atmosphere.js';
import { loadDragonModel, DragonView } from '/client/js/render/dragon.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1280, H = +q.get('h') || 720;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(W, H, false); canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const env = await new HDRLoader().setDataType(THREE.FloatType).loadAsync('/client/assets/env.hdr');
env.mapping = THREE.EquirectangularReflectionMapping; tameEnvironment(env);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromEquirectangular(env).texture; scene.environmentIntensity = 0.9;
const bgc = q.get('bg');
scene.background = new THREE.Color(bgc ? '#' + bgc : '#8a9bb0');
if (q.get('hdrbg')) { scene.background = scene.environment; }
const sun = new THREE.DirectionalLight(SKY.sunColor, 4.2);
sun.position.copy(SKY.sunDir).multiplyScalar(400); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left = -20; sc.right = 20; sc.top = 20; sc.bottom = -20; sc.near = 10; sc.far = 900;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05; sun.shadow.radius = 3;
scene.add(sun, sun.target);
await loadDragonModel('/client/assets/dragon.glb');
const v = new DragonView(q.get('breed') || 'ember');
scene.add(v.root);
if (q.get('far') === '1') v.setFar(true);
const pose = { throttle: +(q.get('thr') || 0.5), yawRate: 0, lookYaw: +(q.get('look') || 0), breath: q.get('breath') === '1', firing: false };
v.phase = +(q.get('phase') || 0.3); v.flapAmp = 0.5;
for (let i = 0; i < 3; i++) v.animate(0.01, pose);
v.phase = +(q.get('phase') || 0.3);
v.animate(0.0001, pose);
v.setLight(1, q.get('breath') === '1' ? 1 : 0, 0);
v.root.rotation.z = +q.get('roll') || 0; v.root.rotation.y = +q.get('yaw') || 0;
v.root.updateMatrixWorld(true);
const cam = new THREE.PerspectiveCamera(+q.get('fov') || 40, W / H, 0.1, 500);
const c = (q.get('cam') || '14,6,-16,0,0.5,0').split(',').map(Number);
cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]);
sun.target.position.set(c[3], c[4], c[5]); sun.position.copy(SKY.sunDir).multiplyScalar(300).add(sun.target.position);
const comp = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
comp.setSize(W, H);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 1.6));
comp.addPass(new OutputPass());
for (let i = 0; i < 2; i++) comp.render();
window.__done = true;
</script></body></html>
